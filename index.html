<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shu Fukuta / 福田 周</title>
  <meta name="description" content="Shu Fukuta — artist site / statement & cv" />

  <style>
    :root{
      /* =========================
         1) 全体トーン（色の司令塔）
         ここだけ触ると全体の“気配”が変わる
         ========================= */

      --bg:#f2f0ea; /* 背景のベース（白すぎない紙） */

      /* ▼文字色（真っ黒NG、青緑ニュアンスの墨）
         ・濃くする → 末尾の .90 を .95 へ
         ・薄くする → .86 とか
      */
      --text:rgba(10,10,10,.90);

      /* ▼サブ文字（薄い）
         ・もっと見せる → .70
         ・さらに消す → .58
      */
      --muted:rgba(10,10,10,.62);
      --faint:rgba(10,10,10,.42);

      /* ▼パネルの透明ガラス感 */
      --paper:rgba(255,255,255,.20);

      /* ▼線 */
      --line:rgba(0,0,0,.10);
      --line2:rgba(0,0,0,.055);

      /* ▼アクセント（青緑の気配）
         ・もっと緑 → 値を上げる
         ・もっと灰 → 値を下げる
      */
      --accent:rgba(60,92,78,.78);
      --accent2:rgba(60,92,78,.42);

      /* ▼横幅 */
      --max:1080px;

      /* ▼余白（画面に合わせて変化） */
      --pad:clamp(16px,3vw,28px);

      /* ▼角丸 */
      --r:14px;

      /* ▼フォント */
      --sans: ui-sans-serif, system-ui, -apple-system,
        "Hiragino Sans","Hiragino Kaku Gothic ProN",
        "Noto Sans JP","Yu Gothic","Meiryo",sans-serif;

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco,
        Consolas, "Liberation Mono","Noto Sans Mono", monospace;

      /* ▼ヘッダーからスクロール下の“薄い膜”が始まる位置 */
      --scrimTop: 140px;

      /* ▼ヘッダーの濃い文字色 */
      --ink: rgba(16,22,22,.88);

      /* ▼ブランド用（名前） */
      --brand: -apple-system, BlinkMacSystemFont,
        "SF Pro Display","SF Pro Text",
        "Helvetica Neue","Helvetica","Arial",
        "Hiragino Sans","Hiragino Kaku Gothic ProN",
        "Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      color:var(--text);
      font-family:var(--sans);
      background: var(--bg);
      background-image: url("img/bg-board.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    body::before{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 520px at 60% 18%,
          rgba(255,255,255,.10),
          rgba(244,242,238,.36) 70%
        ),
        linear-gradient(to bottom,
          rgba(255,255,255,.06),
          rgba(244,242,238,.38)
        );
      z-index:-2;
    }

    .content-scrim{
      position:fixed;
      left:0; right:0; bottom:0;
      top: var(--scrimTop);
      pointer-events:none;
      background:
        linear-gradient(to bottom,
          rgba(244,242,238,.10),
          rgba(244,242,238,.55) 22%,
          rgba(244,242,238,.70) 100%
        );
      z-index:-1;
    }

    body::after{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(to bottom,
          rgba(0,0,0,.05),
          rgba(0,0,0,.05) 1px,
          rgba(0,0,0,0) 3px,
          rgba(0,0,0,0) 7px
        );
      opacity:.035;
      mix-blend-mode:multiply;
      z-index:-1;
    }

    a{ color:inherit; text-decoration:none; }
    a:hover{ color:var(--accent); }
    ::selection{ background: rgba(60,92,78,.16); }

    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding: calc(var(--pad)*1.2) var(--pad) calc(var(--pad)*2);
      position:relative;
    }

    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      padding:18px 0 10px;
      border-bottom:1px solid var(--line);
    }

    .brand{ display:flex; flex-direction:column; gap:4px; }
    .brand .name{
      font-family: var(--brand);
      font-size:clamp(18px,2.2vw,22px);
      font-weight:520;
      letter-spacing:.035em;
      line-height:1.15;
      color: var(--ink);
    }
    .brand .sub{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
      line-height:1.2;
      letter-spacing:.02em;
    }

    nav{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
    }
    nav a{
      position:relative;
      padding:2px 0;
      letter-spacing:.02em;
      color:var(--muted);
    }
    nav a:not(:last-child)::after{
      content:"/";
      margin-left:10px;
      color: rgba(16,22,22,.22);
    }
    nav a.active{ color: var(--ink); }
    nav a.active::before{
      content:"";
      position:absolute;
      left:0; right:0; bottom:-4px;
      height:1px;
      background: linear-gradient(to right,
        rgba(60,92,78,0),
        rgba(60,92,78,.55),
        rgba(60,92,78,0)
      );
    }
    nav a:hover{ color: var(--ink); }

    .panel{
      margin-top:18px;
      background: var(--paper);
      border: 1px solid rgba(0,0,0,.065);
      border-radius: var(--r);
      backdrop-filter: blur(3px);
      box-shadow:
        0 10px 24px rgba(0,0,0,.06),
        0 1px 0 rgba(255,255,255,.55) inset;
    }
    .panel .in{ padding: calc(var(--pad)*1.1); }

    h1{
      margin:0 0 10px;
      font-size: clamp(18px, 2.6vw, 22px);
      font-weight: 560;
      letter-spacing:.02em;
      color: var(--ink);
    }

    .meta{
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .section{
      padding-top: 14px;
      border-top: 1px solid var(--line2);
      margin-top: 14px;
    }

    .row{
      display:grid;
      grid-template-columns: 160px minmax(0,1fr);
      gap: 14px;
      align-items:start;
      padding: 10px 0;
      border-top: 1px solid var(--line2);
    }
    .row:first-child{ border-top:0; }
    .k{
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      padding-top: 2px;
    }
    .v{
      font-size: 14px;
      line-height: 1.9;
      color: rgba(10,10,10,.86);
      white-space: pre-wrap;
    }

    footer{
      margin-top:18px;
      padding-top:12px;
      border-top:1px solid var(--line);
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    @media (max-width: 820px){
      .row{ grid-template-columns: 1fr; gap: 6px; }
      .k{ padding-top:0; }
    }

    /* ===== index mobile only: brand smaller + nav wrap (2nd line = contact only) ===== */
    @media (max-width: 520px){

      /* 左上「Shu Fukuta / 福田周」「artist site / statement」を確実に小さく */
      header .brand .name{
        font-size: 16px !important;  /* ←調整ポイント：15px/14pxでもOK */
        line-height: 1.15 !important;
      }
      header .brand .sub{
        font-size: 11px !important;
        line-height: 1.2 !important;
      }

      /* ナビ：cv をもっと左に詰める（= nav 内の余白/隙間を縮める） */
      header nav{
        padding-left: 0 !important;
        margin-left: 0 !important;
        display: flex !important;
        flex-wrap: wrap !important;
        align-items: center !important;
      }
      header nav a{
        margin-left: 0 !important;
        padding-left: 0 !important;
      }

      /* 2段目を「contact だけ」にする（contact を強制的に折り返す） */
      header nav a[href*="contact"]{
        flex-basis: 100% !important;   /* これで2段目へ */
        margin-left: auto !important;  /* 右寄せ */
        text-align: right !important;
      }
    }
  </style>
