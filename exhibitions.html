<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Exhibitions / Shu Fukuta</title>
  <meta name="description" content="Exhibitions — Shu Fukuta / 福田 周" />

  <style>
    :root{
      --bg:#f2f0ea;
      --ink:   rgba(16,22,22,.88);
      --text:  rgba(16,22,22,.82);
      --muted: rgba(16,22,22,.58);
      --faint: rgba(16,22,22,.40);

      --accent:#2563eb; /* 青アクセント */
      --accent2: rgba(37,99,235,.35);

      --panel:   rgba(230,236,242,.20);
      --line2: rgba(16,22,22,.3);

      --max:1040px;
      --pad:clamp(16px,3vw,28px);
      --r:14px;
      --scrimTop:120px;

      --sans:-apple-system,BlinkMacSystemFont,
        "SF Pro Text","SF Pro Display",
        "Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;

      --brand:-apple-system,BlinkMacSystemFont,
        "SF Pro Display","SF Pro Text",
        "Helvetica Neue","Helvetica","Arial",
        "Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;

      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,
        Consolas,"Liberation Mono","Noto Sans Mono",monospace;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      color:var(--text);
      font-family:var(--sans);
      background: var(--bg);
      background-image:url("img/bg-board.jpg");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      -webkit-font-smoothing:antialiased;
    }

    body::before{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 520px at 60% 18%,
          rgba(255,255,255,.06),
          rgba(242,240,234,.18) 70%
        ),
        linear-gradient(to bottom,
          rgba(255,255,255,.03),
          rgba(242,240,234,.22)
        );
      z-index:-2;
    }

    .content-scrim{
      position:fixed;
      left:0; right:0; bottom:0;
      top: var(--scrimTop);
      pointer-events:none;
      background:
        linear-gradient(to bottom,
          rgba(242,240,234,.05),
          rgba(242,240,234,.40) 26%,
          rgba(242,240,234,.54) 100%
        );
      z-index:-1;
    }

    a{ color:inherit; text-decoration:none; }
    a:hover{ color:var(--accent); }

    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding: calc(var(--pad)*1.2) var(--pad) calc(var(--pad)*2);
    }

    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      padding:18px 0 10px;
      border-bottom:1px solid var(--line2);
    }

    .brand .name{
      font-family:var(--brand);
      font-size:clamp(18px,2.2vw,22px);
      font-weight:520;
      letter-spacing:.035em;
      color:var(--ink);
    }
    .brand .sub{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
    }

    nav{
      display:flex;
      gap:10px;
      font-family:var(--mono);
      font-size:12px;
    }
    nav a{
      color:var(--muted);
      position:relative;
    }
    nav a.active{ color:var(--ink); }

    .panel{
      margin-top:20px;
      background:var(--panel);
      border-radius:var(--r);
      backdrop-filter:blur(2px);
      box-shadow:0 18px 46px rgba(0,0,0,.055);
      padding: calc(var(--pad)*1.1);
    }

    .label{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.06em;
      margin-bottom:16px;
    }

    /* ===== GRID ===== */

    .ex-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:22px;
    }

    .ex-item{
      display:block;
      transition:transform .15s ease;
    }

    .ex-item img{
      width:100%;
      border-radius:12px;
      display:block;
      margin-bottom:12px;
    }

    .ex-item:hover{
      transform:translateY(-4px);
    }

    .ex-year{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
    }

    .ex-title{
      font-size:15px;
      margin-top:4px;
      color:var(--ink);
    }

    .ex-venue{
      font-size:13px;
      color:var(--muted);
      margin-top:2px;
    }

    footer{
      margin-top:26px;
      padding-top:12px;
      border-top:1px solid rgba(16,22,22,.08);
      font-family:var(--mono);
      font-size:12px;
      color:var(--faint);
      display:flex;
      justify-content:space-between;
    }
  </style>
  <link rel="stylesheet" href="assets/common.css">
</head>

<body>
<div class="content-scrim"></div>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="name">Shu Fukuta / 福田 周</div>
      <div class="sub">artist site / exhibitions</div>
    </div>
    <nav>
      <a href="index.html">cv</a>
      <a href="works.html">works</a>
      <a class="active" href="exhibitions.html">exhibitions</a>
      <a href="blog.html">blog</a>
      <a href="contact.html">contact</a>
    </nav>
  </header>

  <section class="panel">
    <div class="label">exhibitions</div>
    <div class="ex-grid" id="exhibitions"></div>
  </section>

  <footer>
    <div>© Shu Fukuta</div>
    <div>exhibitions</div>
  </footer>
</div>

<script>
fetch('data/exhibitions.json')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('exhibitions');

    // 年降順ソート
    data.sort((a,b)=> b.year - a.year);

    data.forEach(ex=>{
      container.innerHTML += `
        <a class="ex-item" href="${ex.link}">
          <img src="${ex.thumb}" alt="">
          <div class="ex-year">${ex.year}</div>
          <div class="ex-title">${ex.title}</div>
          <div class="ex-venue">${ex.venue}</div>
        </a>
      `;
    });
  });
</script>

</body>
</html>
